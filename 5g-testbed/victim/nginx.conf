# Victim web service for the RA3 evaluation testbed.
#
# Serves a trivial page and exposes stub_status so victim/metrics.py can read
# the handled-request counter. The RA3 server-side actions edit this file at
# runtime (via the testbed-agent) between the marker comments below and reload
# nginx: enable_http_rate_limit fills the two RATE_LIMIT markers,
# set_connection_timeout rewrites the timeout values. Markers must stay exact.

worker_processes  1;
events { worker_connections  1024; }

http {
    #RA3_RATE_LIMIT_ZONE
    client_body_timeout   60s;
    client_header_timeout 60s;
    keepalive_timeout     65s;

    server {
        listen 80 default_server;
        server_name _;

        location / {
            #RA3_RATE_LIMIT_REQ
            return 200 "victim ok\n";
        }

        location /nginx_status {
            stub_status on;
            allow 127.0.0.1;
            deny all;
        }
    }
}
